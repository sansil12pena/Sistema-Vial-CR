
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesion - Sistema Vial CR</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="auth">

    <section class="panel">

        <h1>Iniciar sesion</h1>

        <p class="nota">
            Acceso de demostracion de Sistema Vial CR.
        </p>

        <!-- Formulario de inicio de sesion -->
        <form id="formLogin">

            <!-- Correo electronico -->
            <div class="grupo-formulario">

                <label for="correo">
                    Correo electronico
                </label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    autocomplete="email"
                    placeholder="ejemplo@correo.com"
                    required>

            </div>

            <!-- Contrasena -->
            <div class="grupo-formulario">

                <label for="contrasena">
                    Contrasena
                </label>

                <input
                    type="password"
                    id="contrasena"
                    name="contrasena"
                    autocomplete="current-password"
                    placeholder="Ingrese su contrasena"
                    required>

            </div>

            <!-- Botones -->
            <div class="acciones">

                <button
                    type="submit"
                    class="boton">
                    Validar acceso
                </button>

                <a
                    href="registro.html"
                    class="boton secundario">
                    Crear cuenta
                </a>

            </div>

            <!-- Mensaje de validacion -->
            <p
                id="mensajeLogin"
                role="status"
                aria-live="polite">
            </p>

        </form>

        <!-- Volver al inicio -->
        <p>
            <a href="index.html" class="enlace">
                Volver al inicio
            </a>
        </p>

        <p class="nota">
            La autenticacion real se implementara al finalizar el desarrollo.
        </p>

    </section>

</main>

<!-- JavaScript del formulario -->
<script src="js/login.js"></script>

</body>
</html>
